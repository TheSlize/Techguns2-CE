name: Release

on:
  workflow_dispatch:

env:
  CURSEFORGE_PROJECT_ID: '1417575'
  MODRINTH_PROJECT_ID: techguns

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            16
            21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep -E '^\s*mod_version\s*=' gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Could not resolve mod_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle build

      - name: Verify artifact
        run: |
          JAR="build/libs/techguns-${{ steps.version.outputs.version }}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected artifact $JAR was not produced:" >&2
            ls -1 build/libs >&2
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: techguns-${{ steps.version.outputs.version }}
          path: ${{ env.jar }}

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-name: Techguns 1.12.2-${{ steps.version.outputs.version }}
          curseforge-dependencies: techguns(incompatible)

          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-name: ${{ steps.version.outputs.version }}

          files: ${{ env.jar }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          game-versions: 1.12.2
          loaders: forge
          java: 8
